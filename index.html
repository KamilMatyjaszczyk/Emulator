<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Emulator Interface</title>
    <style>
        body {
            margin: 24px;
            font: 16px sans-serif;
        }

        #screen {
            width: 480px;
            height: 432px;
            image-rendering: pixelated;
            image-rendering: crisp-edges;
            border: 1px solid #333;
        }

        #reset,
        #run {
            cursor: pointer;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 12px;
        }

        #status {
            min-height: 1.25em;
            margin-top: 10px;
            color: #333;
        }

        #status.error {
            color: #b00020;
        }
    </style>
</head>
<body>
<canvas id="screen" width="160" height="144"></canvas>
<div class="controls">
    <label>
        ROM:
        <input id="rom-file" type="file" accept=".gb,.gbc,application/octet-stream">
    </label>
    <label>
    Save:
    <input id="save-file" type="file" accept=".sav">
    </label>

    <button id="load-save" type="button">Load Save</button>
    <button id="download-save" type="button">Download Save</button>
    <button id="clear-save" type="button">Delete Browser Save</button>
    <button id="reset" type="button">Reset</button>
    <button id="run" type="button">Run</button>
</div>
<div id="status" role="status" aria-live="polite"></div>

<script src="GPU.js?v=5"></script>
<script src="timer.js?v=4"></script>
<script src="key.js?v=6"></script>
<script src="APU.js?v=1"></script>
<script src="MMU.js?v=11"></script>
<script src="z80.js?v=6"></script>
<script src="jsGB.js?v=11"></script>

</body>
</html>
